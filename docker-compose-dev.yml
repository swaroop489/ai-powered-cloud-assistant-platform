services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloud_assistant_backend
    environment:
      - MONGODB_URL=mongodb://mongo:27017/cloud_assistant
    env_file:
      - ./backend/.env
    volumes:
      - deployments_data:/app/deployments
      - terraform_cache:/app/tf_cache
    ports:
      - "8000:8000"
    depends_on:
      - mongo
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: prod
      args:
        - VITE_BACKEND_URL=http://localhost
    container_name: cloud_assistant_frontend
    volumes:
      - ./devops/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app-network

  mongo:
    image: mongo:6.0
    container_name: cloud_assistant_mongo
    ports:
      - "27017:27017"
    volumes:
      - cloud_assistant_mongo_data:/data/db
    networks:
      - app-network

volumes:
  cloud_assistant_mongo_data:
  deployments_data:
  terraform_cache:

networks:
  app-network:
    driver: bridge
