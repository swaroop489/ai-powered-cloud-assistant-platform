name: CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Deploy to AWS EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST_IP }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          # 1. CLEANUP (Nuclear Option)
          # Ensure a fresh start every time to prevent "exists" errors
          sudo rm -rf ~/app
          mkdir -p ~/app
          cd ~/app

          # 2. Clone/Pull latest code
          if [ ! -d ".git" ]; then
            # Private Repo: Clone with Token
            git clone https://${{ secrets.GH_PAT }}@github.com/${{ github.repository }} .
          else
            git pull origin main
          fi

          # 3. Create .env file from Secrets
          echo "MONGO_INITDB_ROOT_USERNAME=${{ secrets.MONGO_USER }}" > .env
          echo "MONGO_INITDB_ROOT_PASSWORD=${{ secrets.MONGO_PASS }}" >> .env
          echo "SECRET_KEY=${{ secrets.BACKEND_SECRET }}" >> .env
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
          echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" >> .env
          echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> .env
          echo "AWS_DEFAULT_REGION=${{ secrets.AWS_DEFAULT_REGION }}" >> .env
          
          # 4. Inject Frontend Secret for Docker Build
          # Source Code expects VITE_BACKEND_URL
          export VITE_BACKEND_URL=${{ secrets.VITE_API_BASE_URL }}
          
          # 5. Start Containers
          # Use -E to pass environment variables (VITE_BACKEND_URL) to sudo
          sudo -E docker compose -f docker-compose.yml up -d --build
