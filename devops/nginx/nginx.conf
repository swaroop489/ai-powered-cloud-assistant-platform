server {
    listen 80;
    server_name localhost;

    # Root directory for static files
    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # 1. Frontend: Handle React Router (SPA)
    # Any route not found acts as index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2. Proxy API requests to Backend
    # Assumes 'backend' is the service name in docker-compose
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # 3. Proxy Token endpoint (for OAuth2/Login)
    location /token {
        proxy_pass http://backend:8000/token;
        proxy_set_header Host $host;
    }
    
    # 4. Proxy Stream endpoint (for SSE)
    # SSE requires disabling buffering
    location /api/deploy/ {
        proxy_pass http://backend:8000/api/deploy/;
        proxy_http_version 1.1;
        proxy_set_header Connection "keep-alive";
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Host $host;
    }
}
