services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloud_assistant_backend_prod
    environment:
      - MONGODB_URL=mongodb://mongo:27017/cloud_assistant
      - SECRET_KEY=${SECRET_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION}
    env_file:
      - .env
    volumes:
      - deployments_data:/app/deployments
      - terraform_cache:/app/tf_cache
    depends_on:
      - mongo
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: prod 
      args:
        - VITE_BACKEND_URL=${VITE_BACKEND_URL:-http://localhost}
    container_name: cloud_assistant_frontend_prod
    ports:
      - "80:80"
    volumes:
      - ./devops/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - app-network

  mongo:
    image: mongo:6.0
    container_name: cloud_assistant_mongo_prod
    volumes:
      - mongo_data:/data/db
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    container_name: cloud_assistant_redis_prod
    networks:
      - app-network

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloud_assistant_celery_prod
    command: celery -A app.celery_app worker --beat --loglevel=info
    environment:
      - MONGODB_URL=mongodb://mongo:27017/cloud_assistant
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION}
    volumes:
      - deployments_data:/app/deployments
      - terraform_cache:/app/tf_cache
    depends_on:
      - redis
      - mongo
    networks:
      - app-network
volumes:
  mongo_data:
  deployments_data:
  terraform_cache:

networks:
  app-network:
    driver: bridge
